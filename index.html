<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login — Pertamina Sales System</title>
  <meta name="description" content="Sistem manajemen pemesanan bahan bakar Pertamina. Login untuk melanjutkan." />

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <!-- App CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="login-body">

  <div class="login-wrapper">

    <!-- Card -->
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="login-logo-icon">
          <!-- Pertamina Flame SVG -->
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4C20 4 10 14 10 22C10 27.5 14.5 32 20 32C25.5 32 30 27.5 30 22C30 14 20 4 20 4Z"/>
            <path d="M20 14C20 14 15 19 15 23C15 25.8 17.2 28 20 28C22.8 28 25 25.8 25 23C25 19 20 14 20 14Z" fill="rgba(255,200,100,0.8)"/>
            <circle cx="20" cy="34" r="2" fill="rgba(255,255,255,0.6)"/>
          </svg>
        </div>
        <div>
          <div class="login-title">PERTAMINA SALES SYSTEM</div>
          <div class="login-subtitle">Sistem Manajemen Pemesanan BBM</div>
        </div>
      </div>

      <!-- Error Alert -->
      <div id="login-error" class="login-error mb-3" style="display:none;">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span id="login-error-msg">Username atau password salah.</span>
      </div>

      <!-- Form -->
      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="login-form-label" for="username">Username</label>
          <div class="position-relative">
            <input
              type="text"
              id="username"
              class="login-form-control"
              placeholder="Masukkan username..."
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="mb-4">
          <label class="login-form-label" for="password">Password</label>
          <div class="position-relative">
            <input
              type="password"
              id="password"
              class="login-form-control"
              placeholder="Masukkan password..."
              autocomplete="current-password"
              style="padding-right: 44px;"
              required
            />
            <button
              type="button"
              id="toggle-password"
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--clr-text-muted);font-size:16px;cursor:pointer;"
              tabindex="-1"
            >
              <i class="bi bi-eye" id="toggle-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span id="btn-login-text">Masuk</span>
          <span id="btn-login-spinner" style="display:none;">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            Memverifikasi...
          </span>
        </button>
      </form>

    </div><!-- /.login-card -->

    <!-- Footer -->
    <div class="login-footer">
      &copy; 2025 Pertamina Sales System &nbsp;·&nbsp; v1.0.0
    </div>

  </div><!-- /.login-wrapper -->

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // ── Redirect if already logged in ──────────
    (function() {
      const session = Auth.getSession();
      if (session && CONFIG.ROLE_PAGES[session.role]) {
        window.location.href = CONFIG.ROLE_PAGES[session.role];
      }
    })();

    // ── Toggle password visibility ──────────────
    document.getElementById('toggle-password').addEventListener('click', function() {
      const pwInput = document.getElementById('password');
      const icon    = document.getElementById('toggle-icon');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwInput.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    // ── Login form submission ────────────────────
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Username dan password wajib diisi.');
        return;
      }

      setLoading(true);
      hideError();

      try {
        const result = await Auth.login(username, password);

        if (result.success) {
          // Redirect to role page
          const target = CONFIG.ROLE_PAGES[result.user.role] || 'index.html';
          window.location.href = target;
        } else {
          showError(result.message || 'Username atau password salah.');
          setLoading(false);
        }
      } catch (err) {
        showError('Koneksi gagal. Periksa URL Apps Script di config.js.');
        console.error(err);
        setLoading(false);
      }
    });

    function setLoading(state) {
      const btn      = document.getElementById('btn-login');
      const btnText  = document.getElementById('btn-login-text');
      const btnSpin  = document.getElementById('btn-login-spinner');
      btn.disabled   = state;
      btnText.style.display = state ? 'none' : 'inline';
      btnSpin.style.display = state ? 'inline' : 'none';
    }

    function showError(msg) {
      const el = document.getElementById('login-error');
      document.getElementById('login-error-msg').textContent = msg;
      el.style.display = 'flex';
      document.getElementById('username').classList.add('is-invalid');
      document.getElementById('password').classList.add('is-invalid');
    }

    function hideError() {
      document.getElementById('login-error').style.display = 'none';
      document.getElementById('username').classList.remove('is-invalid');
      document.getElementById('password').classList.remove('is-invalid');
    }

    // Remove error on input
    ['username','password'].forEach(id => {
      document.getElementById(id).addEventListener('input', hideError);
    });
  </script>
</body>
</html>
